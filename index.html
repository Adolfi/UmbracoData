<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbraco in Numbers</title>
<meta name="description" content="Community and company data from the history of Umbraco, 1997 to today.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>The Numbers 🦄</h1>
      <p class="brand-sub">Umbraco Community and Company data, 1997&ndash;<span id="brand-year">today</span></p>
    </div>
  </div>
</header>

<main id="main">

  <p class="load-error" id="load-error" hidden></p>

  <nav class="metrics" aria-label="Choose a metric">
    <!-- metric buttons injected -->
  </nav>

  <section class="panel chart-panel" aria-labelledby="chart-title">
    <div class="panel-head">
      <div>
        <h2 id="chart-title">&nbsp;</h2>
        <p class="panel-sub" id="chart-sub">&nbsp;</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" role="img" aria-labelledby="chart-title" aria-describedby="chart-desc"></svg>
      <p class="sr-only" id="chart-desc"></p>
      <div class="tip" id="tip" hidden></div>
    </div>

    <p class="footnote" id="footnote"></p>
  </section>

  <section class="panel" aria-labelledby="ms-title">
    <div class="panel-head">
      <div>
        <h2 id="ms-title">Milestones</h2>
        <p class="panel-sub" id="ms-sub">Select a year in the chart to read what happened.</p>
      </div>
    </div>
    <div id="ms-body" class="ms-body"></div>
  </section>

  <footer class="credits">
    <p>
      Figures from
      <a href="https://umbraco.com/about-us/the-history-of-umbraco/" rel="noopener" target="_blank">The History of Umbraco</a><span id="data-date"></span>.
    </p>
  </footer>
</main>

<script src="js/data.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
